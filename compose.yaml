services:
  jellyfin:
    image: jellyfin/jellyfin
    hostname: jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ~/jellyfin/config:/config
      - ~/jellyfin/cache:/cache
      - type: bind
        source: ~/jellyfin/media
        target: /media
    restart: 'unless-stopped'
  caddy:
    image: caddy:2.11.2-alpine
    hostname: caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
      - "80:80"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
volumes:
  caddy_data:

